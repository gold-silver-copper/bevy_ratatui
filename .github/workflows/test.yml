name: test

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  required:
    runs-on: ubuntu-latest
    name: ubuntu - ${{ matrix.toolchain }}
    strategy:
      matrix:
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@v4

      - name: clear disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tools-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: true

      - name: linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: install rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: cargo generate-lockfile
        run: cargo generate-lockfile

      # `--all-features` enables `windowed`, which selects the windowed context and compiles the
      # Crossterm lifecycle tests away, so the default-feature run below is what exercises them.
      - name: cargo test --locked (default features)
        run: cargo test --locked --all-targets

      - name: cargo test --locked (Crossterm without mouse)
        if: matrix.toolchain == 'stable'
        run: >-
          cargo test --locked --no-default-features
          --features std,async_executor,crossterm,keyboard
          --lib --test terminal_lifecycle

      - name: cargo clippy (Crossterm without mouse)
        if: matrix.toolchain == 'stable'
        run: >-
          cargo clippy --locked --no-default-features
          --features std,async_executor,crossterm,keyboard
          --lib --test terminal_lifecycle -- -D warnings

      - name: stress terminal lifecycle
        if: matrix.toolchain == 'stable'
        run: |
          for iteration in $(seq 1 20); do
            cargo test --locked --test terminal_lifecycle -- --test-threads=4
          done

      - name: cargo test --doc (default features)
        run: cargo test --locked --doc

      - name: cargo test --locked (all features/windowed)
        run: cargo test --locked --all-features --all-targets

      - name: cargo test --doc
        run: cargo test --locked --all-features --doc

  os-check:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} - stable
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: cargo generate-lockfile
        run: cargo generate-lockfile

      - name: cargo test --locked (default features)
        run: cargo test --locked --all-targets

      - name: cargo test --locked (all features/windowed)
        run: cargo test --locked --all-features --all-targets

      - name: cache cargo dependencies
        uses: Swatinem/rust-cache@v2

  windows-compile:
    runs-on: windows-latest
    name: windows-latest - stable (compile)
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: cargo generate-lockfile
        run: cargo generate-lockfile

      - name: cargo check (default features)
        run: cargo check --locked --all-targets

      - name: cargo check (all features/windowed)
        run: cargo check --locked --all-features --all-targets
